<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>个股评测中心 · 真实API版</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#202938;--muted:#8b95a7;--line:#e8ebef;--red:#f23031;--orange:#fb8c00;--green:#00b12d;--blue:#3478f6;--dark:#172033}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Microsoft YaHei",Arial,sans-serif}
.header{height:64px;background:var(--dark);color:#fff;display:flex;align-items:center;padding:0 24px;gap:20px;position:sticky;top:0;z-index:20}.logo{font-size:19px;font-weight:700}
.search{margin-left:auto;display:flex;width:400px;max-width:55vw}.search input{flex:1;background:#273249;color:#fff;border:0;padding:11px 14px;outline:0;border-radius:7px 0 0 7px}.search button{border:0;background:var(--blue);color:#fff;padding:0 20px;border-radius:0 7px 7px 0;cursor:pointer}
.container{max-width:1450px;margin:auto;padding:18px}.head{background:#fff;border-radius:12px;padding:20px;display:flex;justify-content:space-between;align-items:center}.name{font-size:26px;font-weight:700}.code{font-size:13px;color:var(--muted);margin-left:8px}.status{margin-top:8px;font-size:13px;color:var(--muted)}.status.ok{color:var(--green)}.status.err{color:var(--red)}
.score{text-align:center}.score-circle{width:100px;height:100px;border-radius:50%;background:conic-gradient(var(--red) 98%,#e8edf2 0);display:grid;place-items:center;position:relative}.score-circle:after{content:"";position:absolute;width:76px;height:76px;border-radius:50%;background:#fff}.score-circle b{position:relative;z-index:1;font-size:30px;color:var(--red)}.score small{display:block;color:var(--muted);margin-top:7px}
.tabs{display:flex;gap:5px;background:#fff;padding:5px;border-radius:10px;margin:15px 0;position:sticky;top:64px;z-index:10;overflow:auto}.tab{border:0;background:transparent;padding:10px 18px;border-radius:7px;white-space:nowrap;color:#667085;cursor:pointer}.tab.active{background:#eef4ff;color:var(--blue);font-weight:700}
.section{display:none}.section.active{display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:15px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:10px}.card{padding:16px}.panel{padding:18px;margin-bottom:15px}.title{font-size:14px;color:#667085;margin-bottom:10px}.value{font-size:24px;font-weight:750}.red{color:var(--red)}.orange{color:var(--orange)}.green{color:var(--green)}.muted{font-size:12px;color:var(--muted);margin-top:7px}
.layout{display:grid;grid-template-columns:1.3fr .7fr;gap:15px}.panel h3{font-size:17px;margin:0 0 15px}.risk-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.risk-summary div{background:#f7f9fb;border-radius:8px;text-align:center;padding:14px}.risk-summary b{display:block;font-size:25px}.high b{color:var(--red)}.mid b{color:var(--orange)}.safe b{color:var(--green)}
.risk-row{display:grid;grid-template-columns:120px 1fr 60px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.risk-row:last-child{border:0}.tag{display:inline-block;padding:4px 8px;border-radius:4px;font-size:12px}.tag.high{background:#fff0f0;color:var(--red)}.tag.mid{background:#fff5e8;color:var(--orange)}.tag.safe{background:#ecfff2;color:var(--green)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:11px 9px;text-align:left;border-bottom:1px solid var(--line)}th{background:#f8fafc;color:#667085}.up{color:var(--red)}.down{color:var(--green)}.event{padding:12px 0;border-bottom:1px solid var(--line);line-height:1.6}.event:last-child{border:0}.event-date{font-size:12px;color:var(--muted)}
pre{background:#111827;color:#d1d5db;padding:14px;border-radius:8px;overflow:auto;font-size:12px;max-height:400px}.empty{padding:35px;text-align:center;color:var(--muted)}
@media(max-width:950px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:600px){.header{padding:0 10px}.logo{font-size:16px}.search{width:58%}.container{padding:10px}.head{padding:14px}.name{font-size:20px}.score-circle{width:78px;height:78px}.score-circle:after{width:60px;height:60px}.score-circle b{font-size:24px}.grid{grid-template-columns:1fr 1fr}.risk-row{grid-template-columns:85px 1fr 40px}}
</style>
</head>
<body>
<header class="header">
<div class="logo">📊 个股评测中心</div>
<div class="search"><input id="code" value="000688" placeholder="股票代码"><button onclick="load()">实时评测</button></div>
</header>

<main class="container">
<section class="head">
<div><div class="name" id="stockName">国城矿业 <span class="code" id="stockCode">000688</span></div><div class="status" id="status">正在读取真实 API...</div></div>
<div class="score"><div class="score-circle"><b id="score">--</b></div><small>个股评测</small></div>
</section>

<nav class="tabs">
<button class="tab active" onclick="tab('overview',this)">综合评测</button>
<button class="tab" onclick="tab('risk',this)">风险扫描</button>
<button class="tab" onclick="tab('events',this)">事件雷达</button>
<button class="tab" onclick="tab('json',this)">原始 JSON</button>
</nav>

<section id="overview" class="section active">
<div class="grid" id="metrics"></div>
<div class="layout"><div class="panel"><h3>风险分类</h3><div id="riskList"></div></div><div class="panel"><h3>风险统计</h3><div class="risk-summary" id="riskSummary"></div></div></div>
</section>

<section id="risk" class="section">
<div class="panel"><h3>风险扫描明细</h3><div id="riskDetail"></div></div>
</section>

<section id="events" class="section">
<div class="panel"><h3>市场 / 交易事件</h3><div id="eventsList"></div></div>
</section>

<section id="json" class="section">
<div class="panel"><h3>API 原始 JSON</h3><pre id="raw">{}</pre></div>
</section>
</main>

<script>
const API="https://api.duishu.com/dxwapp/gegu/saolei?code=";
let rawData=null;

function esc(v){return String(v??"").replace(/[&<>"']/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]))}
function strip(v){return String(v??"").replace(/<[^>]*>/g,"").replace(/&nbsp;/g," ")}
function levelClass(n){return n===3?"high":n===2?"mid":"safe"}
function levelText(n){return n===3?"高风险":n===2?"中风险":"安全"}

async function load(){
 const code=document.getElementById("code").value.trim();
 if(!code)return;
 const status=document.getElementById("status");
 status.className="status";status.textContent="正在请求："+API+code;
 try{
   const res=await fetch(API+encodeURIComponent(code),{cache:"no-store"});
   if(!res.ok)throw new Error("HTTP "+res.status);
   const json=await res.json();
   rawData=json;render(json,code);
   status.className="status ok";status.textContent="✓ 真实 API 加载成功 · "+new Date().toLocaleTimeString();
 }catch(e){
   status.className="status err";
   status.textContent="✕ API 请求失败："+e.message+"（如果浏览器拦截 CORS，需要通过后端代理请求）";
 }
}

function render(json,code){
 const data=json.data||json;
 const scan=data.saolei||data;
 const cats=scan.list||[];
 const total=scan.total?.item||[];
 document.getElementById("stockCode").textContent=code;
 document.getElementById("score").textContent=data.guxing?.head_info?.score||"--";
 if(data.guxing?.head_info?.t1)document.querySelector(".score small").textContent=data.guxing.head_info.t1;

 let all=[];
 cats.forEach(c=>(c.list||[]).forEach(x=>all.push({...x,category:c.name})));
 const high=all.filter(x=>x.risk_level===3).length;
 const mid=all.filter(x=>x.risk_level===2).length;
 const safe=all.filter(x=>x.risk_level===1).length;

 document.getElementById("riskSummary").innerHTML=`
 <div class="high"><b>${high}</b>高风险项</div>
 <div class="mid"><b>${mid}</b>中风险项</div>
 <div class="safe"><b>${safe}</b>安全项</div>`;

 document.getElementById("metrics").innerHTML=`
 <div class="card"><div class="title">高风险项</div><div class="value red">${high}</div><div class="muted">来自真实扫描 API</div></div>
 <div class="card"><div class="title">中风险项</div><div class="value orange">${mid}</div><div class="muted">需要重点关注</div></div>
 <div class="card"><div class="title">安全项</div><div class="value green">${safe}</div><div class="muted">当前扫描结果</div></div>
 <div class="card"><div class="title">扫描项目</div><div class="value">${all.length}</div><div class="muted">财务 / 市场 / 交易</div></div>`;

 document.getElementById("riskList").innerHTML=cats.map(c=>{
   const n=(c.list||[]).length;
   const h=(c.list||[]).filter(x=>x.risk_level===3).length;
   const m=(c.list||[]).filter(x=>x.risk_level===2).length;
   return `<div class="risk-row"><b>${esc(c.name)}</b><span>${h?`<span class="tag high">${h} 高风险</span>`:""} ${m?`<span class="tag mid">${m} 中风险</span>`:""} ${!h&&!m?`<span class="tag safe">安全</span>`:""}</span><span>${n}项</span></div>`
 }).join("");

 document.getElementById("riskDetail").innerHTML=all.map(x=>`
 <div class="risk-row">
   <b>${esc(x.title)}</b>
   <div><span class="tag ${levelClass(x.risk_level)}">${levelText(x.risk_level)}</span> ${strip(x.text||"")}</div>
   <span>${x.risk_level===3?"⚠":x.risk_level===2?"注意":"✓"}</span>
 </div>`).join("")||'<div class="empty">暂无风险数据</div>';

 let events=[];
 all.forEach(x=>{
   (x.event_list?.list||[]).forEach(e=>events.push({title:x.title,date:e.date,text:strip(e.title||"")}));
   (x.event_list?.tab_list||[]).forEach(()=>{});
 });
 document.getElementById("eventsList").innerHTML=events.length?events.map(e=>`<div class="event"><div class="event-date">${esc(e.date)} · ${esc(e.title)}</div><div>${esc(e.text)}</div></div>`).join(""):'<div class="empty">当前 API 未返回事件列表</div>';

 document.getElementById("raw").textContent=JSON.stringify(json,null,2);
}

function tab(id,btn){
 document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");btn.classList.add("active");
}
load();
</script>
</body>
</html>
